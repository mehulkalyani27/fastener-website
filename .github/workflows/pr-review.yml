name: Claude PR Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Creates/updates a progress comment on the PR while Claude works.
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Act as a senior engineer reviewing this PR.

            Read `CLAUDE.md` first and use it as the project's source of truth.

            Review ONLY the changes introduced by this PR. Inspect relevant
            existing code when necessary to understand the change and its impact.

            This is a review-only task:
            - Do not modify repository files.
            - Do not commit.
            - Do not push.
            - Do not merge.
            - Do not fix issues automatically.

            Find only concrete, actionable problems involving:

            - Bugs or regressions
            - Security or data exposure
            - Architecture violations
            - Incorrect Next.js/React/TypeScript usage
            - Supabase/data-access issues
            - Performance problems
            - Responsive/accessibility problems
            - Significant SEO or maintainability issues

            Before reporting an issue, verify it against the repository.
            Do not guess.

            Ignore:

            - Personal style preferences
            - Cosmetic/nitpick comments
            - Pure refactoring suggestions
            - Hypothetical problems without evidence
            - Unrelated existing issues
            - Duplicate findings

            Severity:

            - CRITICAL: Severe security, data-loss, or application-breaking issue.
            - HIGH: Significant issue that should block merging.
            - MEDIUM: Meaningful issue that should be addressed but is not
              necessarily merge-blocking.
            - LOW: Minor but concrete and actionable issue.

            For every actionable finding:

            1. Post the finding as a GitHub PR comment.
            2. When possible, use an inline comment attached to the exact
               changed file and line where the issue occurs.
            3. For findings that cannot be attached to a specific line,
               use a normal PR comment.
            4. Do not create duplicate comments for the same issue.

            Use this format:

            [SEVERITY] Title

            Location: file:line

            Problem:
            Concise explanation of the concrete issue and why it matters.

            Fix:
            Concise recommendation for resolving the issue.

            Example:

            [LOW] Footer product-category links are not distinct

            Location: src/components/layout/site-footer.tsx:40

            Problem:
            All product-category links currently point to the same
            `/#products` destination, so individual categories do not have
            distinct destinations.

            Fix:
            Link each category to its specific destination once category-level
            sections exist, or use a single Products link until then.

            After publishing all findings, provide this summary:

            Critical: X | High: X | Medium: X | Low: X

            If no meaningful issues are found:

            No actionable issues found.

            Never claim that tests, build, lint, or type checks passed unless
            you actually verified them.

            If validation could not be performed, explicitly state why.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
